variables:
  catalog:
    description: Unity Catalog catalog

  schema:
    description: Unity Catalog schema

  warehouse_id:
    description: SQL warehouse used by Genie

  app_name:
    description: Sepsis Databricks App name

  genie_space_file:
    description: Environment-specific Genie space definition

  model_serving_endpoint_name:
    description: Model Serving endpoint name

  model_name:
    description: Unity Catalog registered model name

  model_version:
    description: MLflow registered model version

targets:
  dev:
    variables:
      catalog: clinical_dev
      schema: sepsis
      app_name: stable-gated-sepsis-agent-dev
      genie_space_file: ./sepsis.geniespace.json

      model_serving_endpoint_name: sepsis-supervisor-mlflow-poc-dev
      model_name: clinical_dev.sepsis.sepsis_supervisor_mlflow_poc

  qa:
    variables:
      catalog: clinical_qa
      schema: sepsis
      app_name: stable-gated-sepsis-agent-qa
      genie_space_file: ./sepsis.geniespace.qa.json

      model_serving_endpoint_name: sepsis-supervisor-mlflow-poc-qa
      model_name: clinical_qa.sepsis.sepsis_supervisor_mlflow_poc