resources:
  model_serving_endpoints:
    sepsis_supervisor_endpoint:
      name: ${var.model_serving_endpoint_name}

      config:
        served_entities:
          - name: sepsis-supervisor-${bundle.target}
            entity_name: ${var.model_name}
            entity_version: ${var.model_version}
            workload_size: Small
            scale_to_zero_enabled: true