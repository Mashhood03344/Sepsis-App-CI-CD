name: Sepsis Supervisor CI/CD

on:
  pull_request:
    branches: [dev, qa]
  push:
    branches: [dev, qa]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY_DEV to remove the dev bundle resources
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref || github.ref_name }}
    env:
      BUNDLE_TARGET: ${{ github.base_ref || github.ref_name }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_BUNDLE_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/sepsis-supervisor/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 1.11.0

      - name: Verify Databricks bundle file
        working-directory: ${{ github.workspace }}
        run: |
          test -f databricks.yml
          echo "Bundle file found: $PWD/databricks.yml"

      - name: Plan target bundle deployment
        working-directory: ${{ github.workspace }}
        run: databricks bundle plan -t ${{ env.BUNDLE_TARGET }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Validate target bundle configuration
        working-directory: ${{ github.workspace }}
        run: databricks bundle validate -t ${{ env.BUNDLE_TARGET }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

