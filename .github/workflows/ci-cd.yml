name: Sepsis Supervisor CI/CD

on:
  pull_request:
    branches: [dev, qa]
  push:
    branches: [dev, qa]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY_DEV to remove the dev bundle resources
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Detect Changed areas
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref || github.ref_name }}

    outputs:
      model_changed: ${{ steps.changes.outputs.model_changed }}
      bundle_changed: ${{ steps.changes.outputs.bundle_changed }}


    env:
      BUNDLE_TARGET: ${{ github.base_ref || github.ref_name }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_BUNDLE_ROOT: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        run: |
          echo "Head commit message:"
          echo '${{ github.event.head_commit.message }}'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git diff --name-only \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" \
                > changed_files.txt
          else
              git diff --name-only \
                "${{ github.event.before }}" \
                "${{ github.sha }}" \
                > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt

          if grep -Eq '^(model/|src/sepsis/)' changed_files.txt; then
            echo "model_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "model_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq \
          '^(resources/|jobs/|databricks.yml|variables.yml)' \
          changed_files.txt; then
            echo "bundle_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 1.11.0

      - name: Install application and model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/sepsis-supervisor/requirements.txt
          python -m pip install -r model/requirements.txt

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Resolve model serving configuration
        id: model-config
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import yaml

          target = os.environ["BUNDLE_TARGET"]

          with open("variables.yml", "r", encoding="utf-8") as f:
              config = yaml.safe_load(f)

          variables = config["targets"][target]["variables"]

          print(
              f"endpoint_name="
              f"{variables['model_serving_endpoint_name']}"
          )
          print(
              f"model_name="
              f"{variables['model_name']}"
          )
          PY

      - name: Resolve existing model version
        id: model-version
        shell: bash
        env:
          MODEL_NAME: ${{ steps.model-config.outputs.model_name }}
        run: |
          MODEL_VERSION="$(
            python - <<'PY'
          import os
          import mlflow
          from mlflow import MlflowClient

          mlflow.set_registry_uri("databricks-uc")

          model_name = os.environ["MODEL_NAME"]

          client = MlflowClient()

          versions = client.search_model_versions(
              f"name='{model_name}'"
          )

          if not versions:
              raise RuntimeError(
                  f"No registered versions found for {model_name}"
              )

          latest = max(
              versions,
              key=lambda version: int(version.version)
          )

          print(latest.version)
          PY
          )"

          echo "model_version=${MODEL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify Databricks bundle file
        working-directory: ${{ github.workspace }}
        run: |
          test -f databricks.yml
          echo "Bundle file found: $PWD/databricks.yml"

      - name: Validate Databricks bundle
        env:
          MODEL_VERSION: ${{ steps.model-version.outputs.model_version }}
        run: |
          databricks bundle validate \
            -t "${BUNDLE_TARGET}" \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}" \
            --var="model_version=${MODEL_VERSION}"

      - name: Plan Databricks bundle
        env:
          MODEL_VERSION: ${{ steps.model-version.outputs.model_version }}
        run: |
          databricks bundle plan \
            -t "${BUNDLE_TARGET}" \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}" \
            --var="model_version=${MODEL_VERSION}"


