name: Sepsis Supervisor CI/CD

on:
  pull_request:
    branches: [dev, qa]
  push:
    branches: [dev, qa]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref || github.ref_name }}
    env:
      BUNDLE_TARGET: ${{ github.base_ref || github.ref_name }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/sepsis-supervisor/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate target bundle configuration
        run: databricks bundle validate -t ${{ env.BUNDLE_TARGET }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

  deploy:
    name: Deploy ${{ github.ref_name }} environment
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'qa')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate target bundle
        run: databricks bundle validate -t ${{ github.ref_name }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Deploy Databricks resources
        run: databricks bundle deploy -t ${{ github.ref_name }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Provision environment infrastructure
        run: databricks bundle run -t ${{ github.ref_name }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}" sepsis_infrastructure

      - name: Run deployment evaluation
        run: databricks bundle run -t ${{ github.ref_name }} --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}" sepsis_evaluation