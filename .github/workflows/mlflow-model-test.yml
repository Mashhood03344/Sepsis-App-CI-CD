name: Sepsis MLflow Model Test

on:
  push:
    branches:
      - feature/mlflow-packaging

permissions:
  contents: read

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model/requirements.txt

      - name: Show MLflow environment
        run: |
          python -m pip show mlflow
          python -c "import mlflow; print(f'MLflow version: {mlflow.__version__}')"

      - name: Validate MLflow model import
        run: |
          python -c "from src.sepsis.supervisor_model import SepsisSupervisorModel; print('SepsisSupervisorModel import successful')"