name: Sepsis MLflow Model Test

on:
  push:
    branches:
      - feature/mlflow-packaging

permissions:
  contents: read

jobs:
  test-model:
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        run: |
          echo "Head commit message:"
          echo '${{ github.event.head_commit.message }}'

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          if grep -Eq '^(model/|src/sepsis/)' changed_files.txt; then
            echo "model_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "model_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(resources/model-serving/|databricks.yml)' changed_files.txt; then
            echo "bundle_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event.head_commit.message }}" == *"[deploy-serving]"* ]]; then
            echo "deploy_requested=true" >> "$GITHUB_OUTPUT"
            echo "Deployment requested"
          else
            echo "deploy_requested=false" >> "$GITHUB_OUTPUT"
            echo "Deployment not requested"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 1.11.0

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model/requirements.txt

      - name: Show MLflow environment
        run: |
          python -m pip show mlflow
          python -c "import mlflow; print(f'MLflow version: {mlflow.__version__}')"

      - name: Validate MLflow model import
        if: steps.changes.outputs.model_changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "from sepsis.supervisor_model import SepsisSupervisorModel; print('SepsisSupervisorModel import successful')"
      
      - name: Log and validate MLflow model
        if: steps.changes.outputs.model_changed == 'true'
        id: log-model
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python -u model/log_model.py

      - name: Verify logged model URI
        if: steps.changes.outputs.model_changed == 'true'
        run: |
          MODEL_URI="${{ steps.log-model.outputs.model_uri }}"

          echo "Model URI from logging step: ${MODEL_URI}"

          if [[ -z "${MODEL_URI}" ]]; then
            echo "ERROR: log-model did not export model_uri"
            exit 1
          fi

      - name: Validate packaged MLflow model
        if: steps.changes.outputs.model_changed == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          MODEL_URI: ${{ steps.log-model.outputs.model_uri }}
        run: |
          set -euo pipefail

          if [[ -z "${MODEL_URI}" ]]; then
            echo "ERROR: MODEL_URI is empty"
            exit 1
          fi

          echo "Loading packaged model without repository PYTHONPATH: ${MODEL_URI}"

          env -u PYTHONPATH MODEL_URI="${MODEL_URI}" python - <<'PY'
          import os
          import mlflow

          mlflow.set_tracking_uri("databricks")

          model_uri = os.environ["MODEL_URI"]
          print(f"Loading model: {model_uri}")

          model = mlflow.pyfunc.load_model(model_uri)

          result = model.predict([
              {"question": "Show a certified sepsis answer"}
          ])

          print(f"Packaged model result: {result}")

          assert result[0]["route"] == "CERTIFIED_QA"

          print("Packaged MLflow model validation successful")
          PY

      - name: Register MLflow model in Unity Catalog
        if: steps.changes.outputs.model_changed == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python -u model/register_model.py \
            --model-uri "${{ steps.log-model.outputs.model_uri }}" \
            --model-name "clinical_dev.sepsis.sepsis_supervisor_mlflow_poc"

      - name: Validate Databricks bundle
        if: steps.changes.outputs.bundle_changed == 'true' || steps.changes.outputs.deploy_requested == 'true'
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: |
          databricks bundle validate -t dev \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      
      - name: Plan Databricks bundle deployment
        if: steps.changes.outputs.bundle_changed == 'true' || steps.changes.outputs.deploy_requested == 'true'
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: |
          databricks bundle plan -t dev \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Deploy Databricks bundle
        if: >
          steps.changes.outputs.deploy_requested == 'true' &&
          contains(github.event.head_commit.message, '[deploy-serving]')
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          ENDPOINT_NAME: dev_sp_github_actions_dab_dev_sepsis-supervisor-mlflow-poc-dev
        run: |
          set -euo pipefail

          databricks bundle deploy -t dev \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}" &

          DEPLOY_PID=$!

          echo "Bundle deploy started with PID ${DEPLOY_PID}"

          UPDATE_STARTED=false

          while kill -0 "${DEPLOY_PID}" 2>/dev/null; do

            ENDPOINT_JSON="$(
              databricks serving-endpoints get "${ENDPOINT_NAME}" \
                --output json 2>/dev/null || true
            )"

            if [[ -z "${ENDPOINT_JSON}" ]]; then
              echo "Endpoint state is not available yet."
              sleep 30
              continue
            fi

            CONFIG_UPDATE="$(
              echo "${ENDPOINT_JSON}" |
              jq -r '.state.config_update // "UNKNOWN"'
            )"

            READY_STATE="$(
              echo "${ENDPOINT_JSON}" |
              jq -r '.state.ready // "UNKNOWN"'
            )"

            ENTITY_DEPLOYMENT="$(
              echo "${ENDPOINT_JSON}" |
              jq -r '.pending_config.served_entities[0].state.deployment // "UNKNOWN"'
            )"

            ENTITY_MESSAGE="$(
              echo "${ENDPOINT_JSON}" |
              jq -r '.pending_config.served_entities[0].state.deployment_state_message // ""'
            )"

            echo "Endpoint state:"
            echo "  config_update=${CONFIG_UPDATE}"
            echo "  ready=${READY_STATE}"
            echo "  entity_deployment=${ENTITY_DEPLOYMENT}"

            # Ignore the endpoint's previous failed state until
            # Databricks confirms that this deployment has started.
            if [[ "${CONFIG_UPDATE}" == "IN_PROGRESS" ]]; then
              UPDATE_STARTED=true
              echo "New endpoint update detected."
            fi

            # Only treat UPDATE_FAILED as belonging to this deployment
            # after we have observed IN_PROGRESS.
            if [[ "${UPDATE_STARTED}" == "true" ]] && \
               { [[ "${CONFIG_UPDATE}" == "UPDATE_FAILED" ]] || \
                 [[ "${ENTITY_DEPLOYMENT}" == "DEPLOYMENT_FAILED" ]]; }; then

              echo "Model Serving deployment failed."
              echo "Failure reason: ${ENTITY_MESSAGE}"

              kill "${DEPLOY_PID}" 2>/dev/null || true
              wait "${DEPLOY_PID}" 2>/dev/null || true

              exit 1
            fi

            sleep 30
          done

          wait "${DEPLOY_PID}"

      - name: Smoke test model serving endpoint
        if: >
          steps.changes.outputs.deploy_requested == 'true' &&
          contains(github.event.head_commit.message, '[deploy-serving]')
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ENDPOINT_NAME: dev_sp_github_actions_dab_dev_sepsis-supervisor-mlflow-poc-dev
        run: |
          set -euo pipefail

          echo "Testing CERTIFIED_QA route"

          CERTIFIED_RESPONSE="$(
            databricks serving-endpoints query "${ENDPOINT_NAME}" \
              --json '{
                "inputs": [
                  {
                    "question": "Show a certified sepsis answer"
                  }
                ]
              }'
          )"

          echo "${CERTIFIED_RESPONSE}"

          CERTIFIED_ROUTE="$(
            echo "${CERTIFIED_RESPONSE}" |
            jq -r '.predictions[0].route'
          )"

          CERTIFIED_CONFIDENCE="$(
            echo "${CERTIFIED_RESPONSE}" |
            jq -r '.predictions[0].confidence'
          )"

          CERTIFIED_ANSWER="$(
            echo "${CERTIFIED_RESPONSE}" |
            jq -r '.predictions[0].answer'
          )"

          if [[ "${CERTIFIED_ROUTE}" != "CERTIFIED_QA" ]]; then
            echo "Expected CERTIFIED_QA but received ${CERTIFIED_ROUTE}"
            exit 1
          fi

          if [[ -z "${CERTIFIED_CONFIDENCE}" || "${CERTIFIED_CONFIDENCE}" == "null" ]]; then
            echo "Certified response is missing confidence"
            exit 1
          fi

          if [[ -z "${CERTIFIED_ANSWER}" || "${CERTIFIED_ANSWER}" == "null" ]]; then
            echo "Certified response is missing answer"
            exit 1
          fi

          echo "CERTIFIED_QA route passed"

          echo "Testing GENIE route"

          GENIE_RESPONSE="$(
            databricks serving-endpoints query "${ENDPOINT_NAME}" \
              --json '{
                "inputs": [
                  {
                    "question": "Show the latest sepsis trend"
                  }
                ]
              }'
          )"

          echo "${GENIE_RESPONSE}"

          GENIE_ROUTE="$(
            echo "${GENIE_RESPONSE}" |
            jq -r '.predictions[0].route'
          )"

          GENIE_CONFIDENCE="$(
            echo "${GENIE_RESPONSE}" |
            jq -r '.predictions[0].confidence'
          )"

          GENIE_ANSWER="$(
            echo "${GENIE_RESPONSE}" |
            jq -r '.predictions[0].answer'
          )"

          if [[ "${GENIE_ROUTE}" != "GENIE" ]]; then
            echo "Expected GENIE but received ${GENIE_ROUTE}"
            exit 1
          fi

          if [[ -z "${GENIE_CONFIDENCE}" || "${GENIE_CONFIDENCE}" == "null" ]]; then
            echo "GENIE response is missing confidence"
            exit 1
          fi

          if [[ -z "${GENIE_ANSWER}" || "${GENIE_ANSWER}" == "null" ]]; then
            echo "GENIE response is missing answer"
            exit 1
          fi

          echo "GENIE route passed"
          echo "Model serving smoke tests passed"