name: Sepsis MLflow Model Test

on:
  push:
    branches:
      - feature/mlflow-packaging

permissions:
  contents: read

jobs:
  test-model:
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        run: |
          echo "Head commit message:"
          echo '${{ github.event.head_commit.message }}'

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          if grep -Eq '^(model/|src/sepsis/)' changed_files.txt; then
            echo "model_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "model_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(resources/model-serving/|databricks.yml)' changed_files.txt; then
            echo "bundle_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event.head_commit.message }}" == *"[deploy-serving]"* ]]; then
            echo "deploy_requested=true" >> "$GITHUB_OUTPUT"
            echo "Deployment requested"
          else
            echo "deploy_requested=false" >> "$GITHUB_OUTPUT"
            echo "Deployment not requested"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 1.11.0

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model/requirements.txt

      - name: Show MLflow environment
        run: |
          python -m pip show mlflow
          python -c "import mlflow; print(f'MLflow version: {mlflow.__version__}')"

      - name: Check Shape of Endpoint get API
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks serving-endpoints get \
          dev_sp_github_actions_dab_dev_sepsis-supervisor-mlflow-poc-dev \
          --output json

      - name: Validate MLflow model import
        if: steps.changes.outputs.model_changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "from sepsis.supervisor_model import SepsisSupervisorModel; print('SepsisSupervisorModel import successful')"
      
      - name: Log and validate MLflow model
        if: steps.changes.outputs.model_changed == 'true'
        id: log-model
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python -u model/log_model.py

      - name: Register MLflow model in Unity Catalog
        if: steps.changes.outputs.model_changed == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python -u model/register_model.py \
            --model-uri "${{ steps.log-model.outputs.model_uri }}" \
            --model-name "clinical_dev.sepsis.sepsis_supervisor_mlflow_poc"

      - name: Validate Databricks bundle
        if: steps.changes.outputs.bundle_changed == 'true' || steps.changes.outputs.deploy_requested == 'true'
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: |
          databricks bundle validate -t dev \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      
      - name: Plan Databricks bundle deployment
        if: steps.changes.outputs.bundle_changed == 'true' || steps.changes.outputs.deploy_requested == 'true'
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: |
          databricks bundle plan -t dev \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Deploy Databricks bundle
        if: >
          steps.changes.outputs.deploy_requested == 'true' &&
          contains(github.event.head_commit.message, '[deploy-serving]')
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: |
          databricks bundle deploy -t dev \
            --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"