bundle:
  name: sepsis-supervisor
  engine: direct

include:
  - resources/apps/*.yml
  - resources/vector-search/*.yml
  - resources/genie/*.yml
  - jobs/*.yml

variables:
  catalog:
    description: Unity Catalog catalog

  schema:
    description: Unity Catalog schema

  warehouse_id:
    description: SQL warehouse used by Genie

  app_name:
    description: Sepsis Databricks App name

targets:

  dev:
    mode: development
    default: true

    workspace:
      root_path: /Users/${workspace.current_user.userName}/dev/sepsis-supervisor/.bundle/${bundle.name}

    variables:
      catalog: clinical_dev
      schema: sepsis
      warehouse_id: ${var.warehouse_id}
      app_name: stable-gated-sepsis-agent-dev

  qa:
    mode: production

    workspace:
      root_path: /Shared/qa/sepsis-supervisor/.bundle/${bundle.name}

    variables:
      catalog: clinical_qa
      schema: sepsis
      warehouse_id: ${var.warehouse_id}
      app_name: stable-gated-sepsis-agent-qa
